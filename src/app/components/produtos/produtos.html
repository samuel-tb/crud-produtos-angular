<div class="container-produtos">
    <section class="card-formulario">
        <h2>Cadastrar Novo Produto</h2>

        <form (ngSubmit)="salvar()">
            <div class="grupo-input">
                <label for="nome">Nome do Produto</label>
                <input type="text" id="nome" name="nome" [(ngModel)]="novoProduto.nome" placeholder="Ex: Teclado Mecânico" required>
            </div>

            <div class="linha-inputs">
                <div class="grupo-input">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" name="preco" [(ngModel)]="novoProduto.preco" placeholder="0.00" required>
                </div>
                
                <div class="grupo-input">
                    <label for="quantidadeEstoque">Estoque</label>
                    <input type="number" id="quantidadeEstoque" name="quantidadeEstoque" [(ngModel)]="novoProduto.quantidadeEstoque" placeholder="0" required>
                </div>
            </div>

            <div class="grupo-input">
                <label for="categoria">Categoria</label>
                <select id="categoria" name="categoria" [(ngModel)]="novoProduto.categoria" required>
                    <option value="">Selecione uma categoria...</option>
                    @for (cat of categorias; track cat) {
                        <option [value]="cat">{{ cat }}</option>
                    }
                </select>
            </div>

            <button type="submit" class="btn-salvar">Salvar Produtos</button>
        </form>
    </section>
</div>
